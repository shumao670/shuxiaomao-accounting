      const SettingsPage = function({ onNavigate }) {
        var initial = getLLMConfig();
        var [presetId, setPresetId] = useState(initial.presetId);
        var [baseUrl, setBaseUrl] = useState(initial.baseUrl);
        var [model, setModel] = useState(initial.model);
        var [apiKey, setApiKey] = useState(initial.apiKey);
        var [saved, setSaved] = useState(false);
        var [testing, setTesting] = useState(false);
        // testResult: null | { ok: true, message } | { ok: false, message }
        var [testResult, setTestResult] = useState(null);
        var [showKey, setShowKey] = useState(false);

        // 选择预设时自动填入 baseUrl / defaultModel，且不覆盖用户已填的密钥
        var handlePresetChange = function(id) {
          setPresetId(id);
          setTestResult(null);
          if (id !== 'custom') {
            var preset = LLM_PRESETS.find(function(p) { return p.id === id; });
            if (preset) {
              setBaseUrl(preset.baseUrl);
              if (!model || model === '' || LLM_PRESETS.some(function(p) { return p.id === presetId && p.defaultModel === model; })) {
                setModel(preset.defaultModel);
              }
            }
          }
        };

        var handleSave = function() {
          saveLLMConfig({ presetId: presetId, baseUrl: baseUrl.trim(), model: model.trim(), apiKey: apiKey.trim() });
          setSaved(true);
          setTestResult(null);
          setTimeout(function() { setSaved(false); }, 2000);
        };

        // 测试连接：发一个最小 chat completion 请求，验证 baseUrl/apiKey/model 是否可用
        var handleTest = async function() {
          setTestResult(null);
          var trimmedUrl = (baseUrl || '').trim();
          var trimmedKey = (apiKey || '').trim();
          var trimmedModel = (model || '').trim();
          if (!trimmedUrl) {
            setTestResult({ ok: false, message: '请先填写 Base URL' });
            return;
          }
          if (!trimmedModel) {
            setTestResult({ ok: false, message: '请先填写模型名称（如 deepseek-chat、gpt-4o-mini）' });
            return;
          }
          if (!trimmedKey) {
            setTestResult({ ok: false, message: '请先填写 API Key' });
            return;
          }
          var chatUrl = buildChatCompletionsUrl(trimmedUrl);
          if (!chatUrl) {
            setTestResult({ ok: false, message: 'Base URL 格式无效' });
            return;
          }
          setTesting(true);
          try {
            // 先临时保存到 localStorage，避免 getLLMConfig() 读到旧值
            saveLLMConfig({ presetId: presetId, baseUrl: trimmedUrl, model: trimmedModel, apiKey: trimmedKey });
            var controller = new AbortController();
            var timeoutId = setTimeout(function() { controller.abort(); }, 15000);
            var resp = await fetch(chatUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + trimmedKey
              },
              body: JSON.stringify({
                model: trimmedModel,
                messages: [{ role: 'user', content: 'ping' }],
                temperature: 0,
                max_tokens: 1,
                stream: false
              }),
              signal: controller.signal
            });
            clearTimeout(timeoutId);
            if (!resp.ok) {
              var status = resp.status;
              var detail = '';
              try {
                var errBody = await resp.json();
                detail = (errBody && errBody.error && (errBody.error.message || errBody.error.code)) || errBody.message || '';
              } catch (e) {
                try { detail = await resp.text(); } catch (e2) {}
              }
              detail = (detail || '').toString().substring(0, 200);
              var hint = '';
              if (status === 401) hint = '（API Key 无效或已过期）';
              else if (status === 403) hint = '（无权限访问该模型）';
              else if (status === 404) hint = '（Base URL 或模型名称错误）';
              else if (status === 429) hint = '（请求频率超限）';
              else if (status >= 500) hint = '（服务器异常，可稍后重试）';
              setTestResult({ ok: false, message: '连接失败 HTTP ' + status + hint + (detail ? '\n详情：' + detail : '') });
              return;
            }
            // 成功：可能部分供应商会返回余额/模型信息，做一个宽松校验
            try {
              var data = await resp.json();
              if (data && data.choices && data.choices[0]) {
                setTestResult({ ok: true, message: '连接成功！模型 ' + trimmedModel + ' 可用' });
              } else {
                setTestResult({ ok: true, message: '连接成功！（返回数据无 choices 字段，可能是代理服务）' });
              }
            } catch (e) {
              setTestResult({ ok: true, message: '连接成功！（响应不是 JSON，但 HTTP 状态为 200）' });
            }
          } catch (err) {
            var msg = (err && err.message) || String(err);
            if (err && err.name === 'AbortError') msg = '请求超时（15 秒）';
            else if (/Failed to fetch|NetworkError/i.test(msg)) msg = '网络请求失败：无法连接到 ' + chatUrl + '，请检查 Base URL 或网络';
            setTestResult({ ok: false, message: '连接失败：' + msg });
          } finally {
            setTesting(false);
          }
        };

        var hasApiKey = apiKey.trim() !== '';

        return React.createElement('div', { className: 'min-h-screen pb-24 relative overflow-hidden', style: { background: 'linear-gradient(135deg, #f0fdfa 0%, #fdf4ff 30%, #fef9f3 60%, #f0f9ff 100%)' } },
          // 装饰性背景元素
          React.createElement('div', { style: { position: 'absolute', top: '-80px', right: '-60px', width: '220px', height: '220px', borderRadius: '50%', background: 'linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.1))', filter: 'blur(50px)', zIndex: 0 } }),

          React.createElement('div', { style: { position: 'absolute', bottom: '100px', right: '-30px', width: '140px', height: '140px', borderRadius: '50%', background: 'linear-gradient(135deg, rgba(255,159,28,0.1), rgba(236,72,153,0.06))', filter: 'blur(35px)', zIndex: 0 } }),
          React.createElement('header', { className: 'pt-8 pb-4 px-4 bg-white/80 sticky top-0 z-10', style: { backdropFilter: 'blur(12px)' } },
            React.createElement('h1', { className: 'text-xl font-bold text-dark text-center' }, '设置')
          ),
          React.createElement('div', { className: 'px-4 mt-4 space-y-4 relative z-10' },
            // 大模型配置卡片
            React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm' },
              React.createElement('div', { className: 'flex items-center justify-between mb-4' },
                React.createElement('h2', { className: 'text-lg font-bold text-dark' }, '大模型配置'),
                React.createElement('span', { className: 'text-xs px-2 py-1 rounded-full ' + (hasApiKey ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-500') }, hasApiKey ? '已配置' : '未配置')
              ),

              // 模型供应商下拉
              React.createElement('div', { className: 'mb-3' },
                React.createElement('label', { className: 'block text-sm text-gray-600 mb-1' }, '模型供应商'),
                React.createElement('select', {
                  value: presetId,
                  onChange: function(e) { handlePresetChange(e.target.value); },
                  className: 'w-full px-3 py-2.5 bg-gray-50 rounded-xl border-none outline-none text-dark text-sm appearance-none cursor-pointer'
                }, LLM_PRESETS.map(function(p) {
                  return React.createElement('option', { key: p.id, value: p.id }, p.name);

              ),

              // Base URL
              React.createElement('div', { className: 'mb-3' },
                React.createElement('label', { className: 'block text-sm text-gray-600 mb-1' }, 'Base URL'),
                React.createElement('input', {

                })
