可用类别列表：${categoryOptions}

类别说明：
- shopping: 购物（超市、淘宝、京东、拼多多等）
- food: 餐饮（早餐、午餐、晚餐、外卖、吃等）
- transport: 交通（公交、地铁、打车、加油等）
- entertainment: 娱乐（电影、游戏、KTV等）
- living: 居住（房租、水电等）
- medical: 医疗（药、医院等）
- education: 教育（学习、培训等）
- salary: 工资收入
- bonus: 奖金收入
- investment: 理财收入（理财、利息等）
- gift: 礼金收入（红包等）
- other: 其他

请严格按照以下JSON格式输出，不要包含任何额外文字：
{
  "records": [
    {
      "description": "简要描述",
      "amount": 金额数字,
      "category": "类别ID",
      "type": "income或expense"
    }
  ]
}

用户输入：${input}`;

        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);
          
          const response = await fetch(DEEPSEEK_API_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${getApiKey()}`
            },
            body: JSON.stringify({
              model: 'deepseek-chat',
              messages: [{ role: 'user', content: prompt }],
              temperature: 0.1,
              max_tokens: 500
            }),
            signal: controller.signal
          });
          
          clearTimeout(timeoutId);
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);

          const data = await response.json();
          const content = data.choices[0].message.content;

        const now = new Date();
        const [chartType, setChartType] = useState('pie');
        const [periodType, setPeriodType] = useState('month');
        const [selectedYear, setSelectedYear] = useState(now.getFullYear());
        const [selectedMonth, setSelectedMonth] = useState(now.getMonth() + 1);
        const [recordType, setRecordType] = useState('expense');
        
        const totalAmount = getTotalByPeriod(periodType, selectedYear, selectedMonth, recordType);
        const categoryStats = getCategoryStats(periodType, selectedYear, selectedMonth, recordType);
        const sortedStats = [...categoryStats].sort((a, b) => b.amount - a.amount);
        
        const getPeriodLabel = () => {
          if (periodType === 'month') return `${selectedYear}年${selectedMonth}月`;
          return `${selectedYear}年`;
        };
        
        const years = Array.from({ length: 5 }, (_, i) => now.getFullYear() - i);
        const months = Array.from({ length: 12 }, (_, i) => i + 1);
        
        let pieSegments = [];
        if (totalAmount > 0) {
          let currentAngle = 0;
          pieSegments = sortedStats.map(stat => {
            const percentage = (stat.amount / totalAmount) * 100;
            const angle = (percentage / 100) * 360;
            const startAngle = currentAngle;
            currentAngle += angle;
            const startRad = (startAngle - 90) * (Math.PI / 180);
            const endRad = (currentAngle - 90) * (Math.PI / 180);
            const cx = 50, cy = 50, radius = 40;
            const x1 = cx + radius * Math.cos(startRad);
            const y1 = cy + radius * Math.sin(startRad);
            const x2 = cx + radius * Math.cos(endRad);
            const y2 = cy + radius * Math.sin(endRad);
            const largeArc = percentage > 50 ? 1 : 0;
            const path = `M ${cx} ${cy} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArc} 1 ${x2} ${y2} Z`;
            const category = getCategoryById(stat.category);
            return { ...stat, percentage, path, category, cx, cy };
          });
        }
        
        const maxAmount = sortedStats.length > 0 ? Math.max(...sortedStats.map(s => s.amount)) : 1;

        return React.createElement('div', { className: 'min-h-screen bg-light pb-24' },
          React.createElement('header', { className: 'pt-8 pb-4 px-4 bg-white sticky top-0 z-10' },
            React.createElement('h1', { className: 'text-xl font-bold text-dark text-center' }, '收支统计')
          ),
          React.createElement('div', { className: 'px-4 mt-4' },
            React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm mb-4' },
              React.createElement('div', { className: 'flex items-center justify-between mb-4' },
                React.createElement('div', { className: 'flex gap-2' },
                  React.createElement('button', { onClick: () => setRecordType('expense'), className: `px-4 py-2 rounded-lg text-sm font-medium transition-all ${recordType === 'expense' ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-600'}` }, '支出'),
                  React.createElement('button', { onClick: () => setRecordType('income'), className: `px-4 py-2 rounded-lg text-sm font-medium transition-all ${recordType === 'income' ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600'}` }, '收入')
                ),
                React.createElement('div', { className: 'flex gap-2' },
                  React.createElement('button', { onClick: () => setChartType('pie'), className: `px-4 py-2 rounded-lg text-sm font-medium transition-all ${chartType === 'pie' ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600'}` }, '扇形图'),
                  React.createElement('button', { onClick: () => setChartType('bar'), className: `px-4 py-2 rounded-lg text-sm font-medium transition-all ${chartType === 'bar' ? 'bg-primary text-white' : 'bg-gray-100 text-gray-600'}` }, '柱状图')
                )
              ),
              React.createElement('div', { className: 'flex items-center justify-between mb-4' },
                React.createElement('select', { value: periodType, onChange: (e) => setPeriodType(e.target.value), className: 'px-3 py-2 rounded-lg text-sm border border-gray-200 outline-none focus:border-primary' },
                  React.createElement('option', { value: 'month' }, '月度'),
                  React.createElement('option', { value: 'year' }, '年度')
                ),
                React.createElement('div', { className: 'flex items-center gap-2' },
                  React.createElement('select', { value: selectedYear, onChange: (e) => setSelectedYear(parseInt(e.target.value)), className: 'px-3 py-2 rounded-lg text-sm border border-gray-200 outline-none focus:border-primary' },
                    years.map(year => React.createElement('option', { key: year, value: year }, `${year}年`))
                  ),
                  periodType === 'month' && React.createElement('select', { value: selectedMonth, onChange: (e) => setSelectedMonth(parseInt(e.target.value)), className: 'px-3 py-2 rounded-lg text-sm border border-gray-200 outline-none focus:border-primary' },
                    months.map(month => React.createElement('option', { key: month, value: month }, `${month}月`))
                  )
                )
              )
            ),
            sortedStats.length === 0 ? React.createElement('div', { className: 'bg-white rounded-2xl p-12 shadow-sm text-center' },
              React.createElement('div', { className: 'w-16 h-16 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4' },
                React.createElement(icons.BarChart3, { size: 32, className: 'text-gray-400' })
              ),
              React.createElement('p', { className: 'text-gray-400' }, `暂无${recordType === 'income' ? '收入' : '支出'}数据`),
              React.createElement('p', { className: 'text-xs text-gray-300 mt-1' }, `${getPeriodLabel()}还没有${recordType === 'income' ? '收入' : '支出'}记录`)
            ) : React.createElement('div', { className: 'bg-white rounded-2xl p-6 shadow-sm mb-6' },
              React.createElement('div', { className: 'text-center mb-6' },
                React.createElement('p', { className: 'text-xs text-gray-400' }, `${getPeriodLabel()}${recordType === 'income' ? '总收入' : '总支出'}`),
                React.createElement('p', { className: `text-3xl font-bold mt-1 ${recordType === 'income' ? 'text-green-500' : 'text-red-500'}` }, `${recordType === 'income' ? '+' : '-'}¥${formatAmount(totalAmount)}`)
              ),
              chartType === 'pie' ? React.createElement('div', { className: 'flex flex-col items-center mb-6' },
                React.createElement('div', { className: 'relative w-64 h-64' },
                  React.createElement('svg', { viewBox: '0 0 100 100', className: 'w-full h-full' },
                    pieSegments.map(function(segment, index) { return React.createElement('path', { key: index, d: segment.path, fill: segment.category.color, className: 'transition-all duration-300 hover:opacity-80' }); }),
                    pieSegments.length > 0 && React.createElement('circle', { cx: '50', cy: '50', r: '25', fill: 'white' })
                  ),
                  React.createElement('div', { className: 'absolute inset-0 flex flex-col items-center justify-center' },
                    React.createElement('span', { className: 'text-lg font-bold text-dark' }, sortedStats.length),
                    React.createElement('span', { className: 'text-xs text-gray-400' }, '个类别')
                  )
                ),
                React.createElement('div', { className: 'grid grid-cols-2 gap-2 mt-4 w-full' },
                  pieSegments.map(function(segment, index) { return React.createElement('div', { key: index, className: 'flex items-center gap-2' },
                    React.createElement('div', { className: 'w-3 h-3 rounded-full', style: { backgroundColor: segment.category.color } }),
                    React.createElement('span', { className: 'text-sm text-dark' }, segment.category.name),
                    React.createElement('span', { className: 'text-xs text-gray-400 ml-auto' }, segment.percentage.toFixed(0) + '%')
                  ); })
                )
              ) : React.createElement('div', { className: 'h-48' },
                React.createElement('svg', { viewBox: '0 0 300 150', className: 'w-full h-full' },
                  React.createElement('line', { x1: '0', y1: '130', x2: '300', y2: '130', stroke: '#E5E7EB', strokeWidth: '2' }),
                  sortedStats.map(function(stat, index) {
                    var category = getCategoryById(stat.category);
                    var barHeight = (stat.amount / maxAmount) * 100;
                    var x = index * 40 + 30;
                    return React.createElement('g', { key: stat.category },
                      React.createElement('rect', { x: x, y: 130 - barHeight, width: '25', height: barHeight, fill: category.color, rx: '4', className: 'transition-all duration-300 hover:opacity-80' }),
                      React.createElement('text', { x: x + 12.5, y: 140, textAnchor: 'middle', className: 'text-xs fill-gray-400' }, category.name),
                      React.createElement('text', { x: x + 12.5, y: 130 - barHeight - 5, textAnchor: 'middle', className: 'text-xs fill-gray-600 font-medium' }, formatAmount(stat.amount))
                    );
                  })
                )
              ),
              React.createElement('div', { className: 'mt-4 space-y-3' },
                sortedStats.map(function(stat) {
                  var category = getCategoryById(stat.category);
                  var percentage = (stat.amount / totalAmount * 100).toFixed(1);
                  return React.createElement('div', { key: stat.category, className: 'flex items-center justify-between p-3 bg-gray-50 rounded-xl' },
                    React.createElement('div', { className: 'flex items-center gap-3' },
                      React.createElement('div', { className: 'w-8 h-8 rounded-full flex items-center justify-center', style: { backgroundColor: category.color + '20' } },
                        React.createElement(CategoryIcon, { icon: category.icon, color: category.color, size: 16 })
                      ),
                      React.createElement('div', null,
                        React.createElement('p', { className: 'text-dark text-sm font-medium' }, category.name),
                        React.createElement('p', { className: 'text-xs text-gray-400' }, stat.count + '笔')
                      )
                    ),
                    React.createElement('div', { className: 'text-right' },
                      React.createElement('p', { className: 'text-dark font-bold text-sm' }, '¥' + formatAmount(stat.amount)),
                      React.createElement('p', { className: 'text-xs text-gray-400' }, percentage + '%')
                    )
                  );
                })
              )
            )
          )
        );
      };

      const SettingsPage = function() {
        var [apiKey, setApiKey] = useState(getApiKey());
        var [saved, setSaved] = useState(false);

        var handleSave = function() {
          localStorage.setItem('deepseek_api_key', apiKey);
          setSaved(true);
          setTimeout(function() { setSaved(false); }, 2000);
        };

        var handleClear = function() {
          localStorage.removeItem('deepseek_api_key');
          setApiKey('');
          setSaved(true);
          setTimeout(function() { setSaved(false); }, 2000);
        };

        var hasApiKey = getApiKey() !== '';

        return React.createElement('div', { className: 'min-h-screen bg-light pb-24' },
          React.createElement('header', { className: 'pt-8 pb-4 px-4 bg-white sticky top-0 z-10' },
            React.createElement('h1', { className: 'text-xl font-bold text-dark text-center' }, '设置')
          ),
          React.createElement('div', { className: 'px-4 mt-4 space-y-4' },
            React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm' },
              React.createElement('div', { className: 'flex items-center justify-between mb-4' },
                React.createElement('h2', { className: 'text-lg font-bold text-dark' }, 'DeepSeek API密钥'),
                React.createElement('span', { className: `text-xs px-2 py-1 rounded-full ${hasApiKey ? 'bg-green-500 text-white' : 'bg-gray-200 text-gray-500'}` }, hasApiKey ? '已配置' : '未配置')
              ),
              React.createElement('div', { className: 'relative' },
                React.createElement('input', {
                  type: 'text',
                  value: apiKey,
                  onChange: function(e) { setApiKey(e.target.value); },
                  placeholder: '在此输入你的DeepSeek API密钥...',
                  className: 'w-full px-4 py-3 bg-gray-50 rounded-xl border-none outline-none text-dark placeholder-gray-400 text-sm font-mono'
                }),
                apiKey && React.createElement('button', { onClick: handleClear, className: 'absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-400 text-sm' }, '清除')
              ),
              React.createElement('button', {
                onClick: handleSave,
                disabled: apiKey === '',
                className: `w-full mt-4 py-3 rounded-xl font-medium transition-all duration-200 ${apiKey !== '' ? 'bg-primary text-white hover:bg-primary/90 active:scale-[0.98]' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`
              }, saved ? '保存成功!' : '保存密钥')
            ),
            React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm' },
              React.createElement('h2', { className: 'text-lg font-bold text-dark mb-3' }, '使用说明'),
              React.createElement('ul', { className: 'space-y-2 text-sm text-gray-500' },
                React.createElement('li', { className: 'flex items-start gap-2' },
                  React.createElement('span', { className: 'w-1.5 h-1.5 rounded-full bg-primary mt-2 flex-shrink-0' }),
                  React.createElement('span', null, '配置API密钥后，智能识别功能将使用大模型进行精准分类')
                ),
                React.createElement('li', { className: 'flex items-start gap-2' },
                  React.createElement('span', { className: 'w-1.5 h-1.5 rounded-full bg-primary mt-2 flex-shrink-0' }),
                  React.createElement('span', null, '密钥仅存储在您的手机本地，不会上传到服务器')
                ),
                React.createElement('li', { className: 'flex items-start gap-2' },
                  React.createElement('span', { className: 'w-1.5 h-1.5 rounded-full bg-primary mt-2 flex-shrink-0' }),
                  React.createElement('span', null, '未配置密钥时，将使用本地规则进行基础识别')
                ),
                React.createElement('li', { className: 'flex items-start gap-2' },
                  React.createElement('span', { className: 'w-1.5 h-1.5 rounded-full bg-primary mt-2 flex-shrink-0' }),
                  React.createElement('span', null, '记账数据存储在浏览器本地(localStorage)')
                )
              )
            ),
            React.createElement('div', { className: 'bg-white rounded-2xl p-4 shadow-sm' },
              React.createElement('h2', { className: 'text-lg font-bold text-dark mb-3' }, '应用信息'),
              React.createElement('div', { className: 'space-y-2 text-sm' },
                React.createElement('div', { className: 'flex justify-between' },
                  React.createElement('span', { className: 'text-gray-500' }, '版本'),
                  React.createElement('span', { className: 'text-dark font-medium' }, '1.0.0')
                ),
                React.createElement('div', { className: 'flex justify-between' },
                  React.createElement('span', { className: 'text-gray-500' }, '名称'),
                  React.createElement('span', { className: 'text-dark font-medium' }, '舒小茂记账')
                )
              )
            )
          )
        );
      };

      const App = function() {
        var [currentPage, setCurrentPage] = useState('/');
        return React.createElement(RecordsProvider, null,
          React.createElement('div', { className: 'min-h-screen bg-light' },
            currentPage === '/' && React.createElement(HomePage, null),
            currentPage === '/bills' && React.createElement(BillsPage, null),
            currentPage === '/stats' && React.createElement(StatsPage, null),
            currentPage === '/settings' && React.createElement(SettingsPage, null),
            React.createElement(BottomNav, { currentPage: currentPage, onNavigate: setCurrentPage })
          )
        );
      };

      var root = createRoot(document.getElementById('app'));
      root.render(React.createElement(App, null));
    </script>
  </body>
</html>
